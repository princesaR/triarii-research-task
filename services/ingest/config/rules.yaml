# Loaded by the ingest service at startup (RULES_FILE). Rules missing from the DB
# are inserted; rules already in the DB keep their API-edited values.
rules:
  - rule_id: rule-ism-high-power
    name: High power in protected ISM band
    type: power_threshold
    band: { min_mhz: 2400.0, max_mhz: 2483.5 }
    threshold_dbm: -50.0
    min_duration_s: 10
    max_gap_s: 5
    resolve_after_s: 60
    severity: HIGH
    enabled: true

  - rule_id: rule-5g8-high-power
    name: High power in 5.8 GHz band
    type: power_threshold
    band: { min_mhz: 5725.0, max_mhz: 5875.0 }
    threshold_dbm: -45.0
    min_duration_s: 15
    max_gap_s: 5
    resolve_after_s: 90
    severity: MEDIUM
    enabled: true
