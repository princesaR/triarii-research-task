[project]
name = "rf-alert-manager"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Query/Depends)

[tool.ruff.lint.isort]
known-first-party = ["models", "rfam_common", "ingest", "alerts"]

[tool.pytest.ini_options]
# Each service is its own top-level package; the shared package sits next to them.
pythonpath = [".", "shared", "services/ingest", "services/alerts"]
testpaths = ["services/ingest/tests", "services/alerts/tests"]
# importlib mode: both services have a tests/ dir and a conftest.py without name clashes.
addopts = "-q --import-mode=importlib"
