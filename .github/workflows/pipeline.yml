# CI/CD for RF Alert Manager.
#
#   PR / push        -> lint + test (make this check required in branch protection)
#   push to main     -> lint + test -> build both images, tag :<sha>, push to GHCR -> deploy -> smoke
#   workflow_dispatch with `sha` -> rollback: deploy that already-built SHA (no rebuild) -> smoke
#
# Deploy runs on the self-hosted runner inside the VM (label rfam-vm), so the VM needs no
# inbound access. Repo secrets needed: POSTGRES_PASSWORD, INGEST_DB_PASSWORD, ALERTS_DB_PASSWORD.

name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (rollback). Its images must already be in GHCR."
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingest, alerts]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/rfam-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          # Immutable SHA tag is what gets deployed; :latest is only a convenience.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    # Runs after a successful build on main, or directly for a rollback.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'))
    needs: build
    runs-on: [self-hosted, rfam-vm]
    concurrency: deploy-vm  # never two deploys at once
    environment: production
    env:
      SHA: ${{ inputs.sha || github.sha }}
      APP_DIR: /opt/rfam
    steps:
      # Check out the deployed SHA so compose/nginx config match the images.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install deploy files
        run: |
          cp -r deploy/compose.yaml deploy/nginx deploy/postgres "$APP_DIR/"
      - name: Write .env (secrets + image SHAs)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          INGEST_DB_PASSWORD: ${{ secrets.INGEST_DB_PASSWORD }}
          ALERTS_DB_PASSWORD: ${{ secrets.ALERTS_DB_PASSWORD }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          umask 077
          cat > "$APP_DIR/.env" <<EOF
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          INGEST_DB_PASSWORD=${INGEST_DB_PASSWORD}
          ALERTS_DB_PASSWORD=${ALERTS_DB_PASSWORD}
          INGEST_DATABASE_URL=postgresql+psycopg://ingest:${INGEST_DB_PASSWORD}@postgres:5432/ingest_db
          ALERTS_DATABASE_URL=postgresql+psycopg://alerts:${ALERTS_DB_PASSWORD}@postgres:5432/alerts_db
          INGEST_IMAGE=${REGISTRY}/${owner}/rfam-ingest:${SHA}
          ALERTS_IMAGE=${REGISTRY}/${owner}/rfam-alerts:${SHA}
          HTTP_PORT=80
          EOF
      - name: Pull and start
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose -f compose.yaml --env-file .env pull ingest alerts
          docker compose -f compose.yaml --env-file .env up -d --no-build --remove-orphans
          docker compose -f compose.yaml ps
      - name: Smoke test through Nginx
        run: |
          for path in /health /api/v1/sensors /api/v1/rules /api/v1/alerts; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 20 --retry-delay 3 --retry-all-errors "http://localhost${path}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || { echo "Smoke test failed on ${path}"; exit 1; }
          done
          echo "Deployed ${SHA}"
      - name: Logs on failure
        if: failure()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose -f compose.yaml logs --tail 100 ingest alerts nginx
