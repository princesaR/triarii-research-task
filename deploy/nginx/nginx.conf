# Only public entry point. /api/v1/alerts* goes to the alert service, other /api/v1/* to ingest.
# /metrics and per-service /health are not exposed; /health here is Nginx's own liveness.

upstream ingest { server ingest:8000; }
upstream alerts { server alerts:8000; }

server {
    listen 80;
    client_max_body_size 5m;  # batches of up to MAX_BATCH_SIZE observations

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/alerts { proxy_pass http://alerts; }
    location /api/v1/       { proxy_pass http://ingest; }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 404; }
}
