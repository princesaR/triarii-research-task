# RF Alert Manager: runtime stack.
# For now Postgres only; Kafka, the two services and Nginx are added next.
#
#   cp deploy/.env.example deploy/.env   # then set real passwords
#   docker compose -f deploy/compose.yaml up -d
#   docker compose -f deploy/compose.yaml logs -f postgres

name: rfam

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      # Superuser: used only by init.sh on first start, never by the services.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?set INGEST_DB_PASSWORD in deploy/.env}
      ALERTS_DB_PASSWORD: ${ALERTS_DB_PASSWORD:?set ALERTS_DB_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"  # host access for local runs only; never exposed publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
