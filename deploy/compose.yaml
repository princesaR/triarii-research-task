# RF Alert Manager: runtime stack.
# For now Postgres and Kafka; the two services and Nginx are added in Part 2.
#
#   cp deploy/.env.example deploy/.env   # then set real passwords
#   docker compose -f deploy/compose.yaml up -d
#   docker compose -f deploy/compose.yaml logs -f postgres kafka

name: rfam

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      # Superuser: used only by init.sh on first start, never by the services.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?set INGEST_DB_PASSWORD in deploy/.env}
      ALERTS_DB_PASSWORD: ${ALERTS_DB_PASSWORD:?set ALERTS_DB_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"  # host access for local runs only; never exposed publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      # Single node in KRaft mode: this process is both broker and controller (no Zookeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: rfam-kraft-cluster-01a  # fixed, so the data volume stays valid across restarts
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:9092). EXTERNAL: tools on the host (127.0.0.1:9094).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker: internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Sized for one small VM, not a cluster. Defaults are 50 partitions for each internal
      # topic (slow to load on every start) and thread pools meant for a big server.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      # Topics are created explicitly by kafka-init; a typo must fail, not create a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m  # shares a small VM with Postgres and the services
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094"  # host access for local runs only; never exposed publicly
    healthcheck:
      # A plain TCP connect to the broker port. The Kafka CLI tools start a whole JVM per
      # check, which costs seconds of CPU every interval on a small host.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot job: create the topic, then exit. Safe to re-run (--if-not-exists).
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        topics=/opt/kafka/bin/kafka-topics.sh
        # 2 partitions keyed by rule_id|signal_key: per-signal order, room for 2 consumers.
        $$topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic rf.rule-matches --partitions 2 --replication-factor 1 \
          --config retention.ms=604800000
        $$topics --bootstrap-server kafka:9092 --describe --topic rf.rule-matches
    restart: "no"

volumes:
  postgres-data:
  kafka-data:
